# Publish music-metadata-mcp to npm via TRUSTED PUBLISHING (OIDC) — no stored token.
#
# ⚠⚠ THE FILENAME IS PART OF THE CREDENTIAL. npm matches this workflow by name against
# the trusted-publisher config on npmjs.com, case-sensitively and including the `.yml`.
# Renaming or moving this file silently breaks publishing until the config is updated
# to match — the failure looks like an auth error, not a missing file.
#
# WHY THIS EXISTS: publishing used to need a long-lived npm token in ~/.npmrc on the
# prod box. It expired 2026-09-06 and left 2.16.3 fixed-in-git-but-unpublished for a
# day; rotating it needs an interactive TTY, so it could not be done from an agent
# session. OIDC removes the credential entirely — nothing to expire, nothing to leak.
# It is also the migration path npm is forcing: 2FA-bypass tokens lose direct publish
# around January 2027 (changelog 2026-07-08).
#
# THIS CONFIG IS STAGE-ONLY, which is npm's default for configs created after
# 2026-09-03 and their explicit recommendation. `npm stage publish` uploads the version
# in a non-public state; a human then approves it on npmjs.com once malware scanning
# finishes. ⚠ `npm publish` is REJECTED by a stage-only config — if you ever opt into
# direct publishing on npmjs.com, change the command below to match, not the other way
# round. ⚠ `npm stage approve` requires proof-of-presence and CANNOT use OIDC, so the
# approval is deliberately not automatable here. That is the point of it.
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# One publish at a time. Two tags pushed together would otherwise race on the same
# version and produce a confusing half-failure.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The whole mechanism. Without id-token:write GitHub issues no OIDC token and
      # npm falls back to looking for a credential that no longer exists.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14.0.
          node-version: '22'
          # ⚠⚠ NO `registry-url:` HERE, DELIBERATELY — DO NOT ADD IT BACK.
          # setup-node reacts to that input by writing
          #     //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          # into a temp .npmrc. With no token set (which is the entire point of OIDC)
          # the placeholder expands to EMPTY, npm reads the line, concludes auth is
          # already configured, and never starts the OIDC exchange — publishing dies
          # with ENEEDAUTH. That reads exactly like a broken trusted publisher, so it
          # sends you back to minting tokens, which is the thing this workflow exists
          # to stop. npm already defaults to registry.npmjs.org, so the input buys
          # nothing here. Open upstream: npm/documentation#1960, actions/setup-node#1551
          # — npm's own documented example still carries this bug.

      - name: Ensure npm supports trusted publishing
        # Node 22 ships npm 10.x; OIDC needs >= 11.5.1. Pinned to a major rather than a
        # fixed patch so security fixes arrive, and ASSERTED rather than assumed — a
        # silently-old npm fails later with an auth error that reads like a misconfigured
        # trusted publisher, which is a much worse hour than a clear version failure here.
        run: |
          npm install -g npm@^11
          node --version
          npm --version
          node -e '
            const v = process.argv[1];
            const [a, b, c] = v.split(".").map(Number);
            const ok = a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1)));
            if (!ok) {
              console.error("npm " + v + " is below the 11.5.1 minimum for OIDC publishing");
              process.exit(1);
            }
            console.log("npm OK for OIDC: " + v);
          ' "$(npm --version)"

      - name: Assert nothing is impersonating a credential
        # The ENEEDAUTH trap above is invisible until publish time and misattributes
        # itself to the trusted-publisher config. Catch it here, where the message can
        # say what is actually wrong.
        # ⚠ Detection is via PLAIN `npm config list`, not `--json`: npm treats
        # _authToken as protected, so it is omitted from the JSON entirely and
        # `npm config get` on it errors. The text listing is the only surface that
        # admits the key exists. Verified against npm 10 and 11 — a --json check looks
        # correct, passes everywhere, and detects nothing.
        # ⚠ Only the key is ever printed, never the value.
        run: |
          node -e '
            const { execSync } = require("node:child_process");
            const reg = execSync("npm config get registry").toString().trim();
            if (reg !== "https://registry.npmjs.org/") {
              console.error("registry is " + reg + ", expected https://registry.npmjs.org/");
              process.exit(1);
            }
            const lines = execSync("npm config list").toString().split("\n")
              .filter(l => l.includes("_authToken"))
              .map(l => l.split("=")[0].trim());
            if (lines.length) {
              console.error("An _authToken is configured: " + lines.join(", "));
              console.error("npm uses it instead of OIDC and publishing fails ENEEDAUTH.");
              console.error("Usually means setup-node regained a registry-url input.");
              process.exit(1);
            }
            console.log("registry OK: " + reg);
            console.log("no _authToken configured - the OIDC exchange will run");
          '

      - name: Install dependencies
        run: npm ci

      - name: Check the version is coherent before shipping it
        # Three drift guards, each for a failure this package has actually had.
        run: node .github/scripts/check-release.mjs
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Stage the release
        # Provenance is generated automatically for a public repo publishing a public
        # package — no --provenance flag needed.
        run: npm stage publish

      - name: What happens next
        run: |
          echo "Staged. It is NOT public yet."
          echo "Approve it at https://www.npmjs.com/package/music-metadata-mcp/access"
          echo "(the approve button enables once malware scanning finishes)."
